name: Saltare
options:
  bundleIdPrefix: ai.saltare
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

# A shared scheme, so `xcodebuild -scheme Saltare` has something to build and
# everyone who opens the project gets the same one. Without this, Xcode
# autocreates a local scheme per machine and `xcodebuild` finds one with no
# buildables — which exits 0 having compiled nothing.
schemes:
  Saltare:
    build:
      targets:
        Saltare: all

packages:
  SaltareHUD:
    path: Packages/SaltareHUD
  SaltareKit:
    path: Packages/SaltareKit
  SaltareAgent:
    path: Packages/SaltareAgent
  SaltareKeyboard:
    path: Packages/SaltareKeyboard
  SaltareWorkspace:
    path: Packages/SaltareWorkspace

targets:
  Saltare:
    type: application
    platform: iOS
    sources:
      - path: Saltare
      - path: Shared       # ActivityAttributes shared with the widget extension
    dependencies:
      - package: SaltareHUD
      - package: SaltareKit
      - package: SaltareAgent
      - package: SaltareWorkspace
      - target: SaltareWidgets       # embed the widget/control extension
      - target: SaltareShare         # embed the share extension
      - target: SaltareKeyboardExtension   # embed the keyboard
    info:
      path: Saltare/Info.plist
      properties:
        CFBundleDisplayName: saltare
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        # Dark is the system's identity; lock the UIKit chrome to it too.
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSContactsUsageDescription: "saltare searches your contacts so you can call or message them straight from the universal input."
        NSCalendarsUsageDescription: "saltare reads and adds calendar events when you ask the agent about your schedule."
        NSCalendarsFullAccessUsageDescription: "saltare reads and adds calendar events when you ask the agent about your schedule."
        # canOpenURL probes the curated catalog (iOS can't enumerate apps).
        LSApplicationQueriesSchemes:
          - music
          - maps
          - spotify
          - youtube
          - whatsapp
          - slack
          - github
          - googlegmail
          - tg
          - things
        # Deep links from the widget (saltare://search?q=…).
        CFBundleURLTypes:
          - CFBundleURLName: ai.saltare.app
            CFBundleURLSchemes:
              - saltare
        # The agent-turn Live Activity (Lock Screen + Dynamic Island).
        NSSupportsLiveActivities: true
    entitlements:
      path: Saltare/Saltare.entitlements
      properties:
        # Shared container for the workspace Widget snapshot.
        com.apple.security.application-groups:
          - group.ai.saltare.app
        # Shared Keychain so the Share extension reads the workspace token.
        keychain-access-groups:
          - $(AppIdentifierPrefix)ai.saltare.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.saltare.app
        PRODUCT_NAME: Saltare
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES

  SaltareWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SaltareWidgets
      - path: Shared       # the shared ActivityAttributes type
    dependencies:
      - package: SaltareHUD
      - package: SaltareWorkspace   # WorkspaceSnapshot for the workspace widget
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    info:
      path: SaltareWidgets/Info.plist
      properties:
        CFBundleDisplayName: saltare
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SaltareWidgets/SaltareWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.saltare.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.saltare.app.widgets
        PRODUCT_NAME: SaltareWidgets
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  SaltareShare:
    type: app-extension
    platform: iOS
    sources:
      - path: SaltareShare
      # Only what the extension needs — not the widget/ActivityKit files.
      - path: Shared/TokenVault.swift
    dependencies:
      - package: SaltareHUD
      - package: SaltareWorkspace
    info:
      path: SaltareShare/Info.plist
      properties:
        CFBundleDisplayName: Share to saltare
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: SaltareShare/SaltareShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.saltare.app
        keychain-access-groups:
          - $(AppIdentifierPrefix)ai.saltare.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.saltare.app.share
        PRODUCT_NAME: SaltareShare
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  # The keyboard. Named for the target, not the package: the extension's module
  # and the `SaltareKeyboard` package it imports cannot share a name.
  SaltareKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SaltareKeyboardExtension
    dependencies:
      - package: SaltareHUD
      - package: SaltareKeyboard
    info:
      path: SaltareKeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: saltare
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            # The layouts can reach every ASCII character, so iOS may offer this
            # keyboard for passcode fields.
            IsASCIICapable: true
            PrefersRightToLeftLayout: false
            PrimaryLanguage: en-US
            # Full Access buys haptics, the network and the shared container.
            # The keyboard needs none of them yet — it types locally against a
            # bundled word list — and asking for it is the single scariest
            # prompt iOS shows. `KeyFeedback` already degrades to the input
            # click, so this flips to true the day the keyboard needs the
            # workspace, not before.
            RequestsOpenAccess: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.saltare.app.keyboard
        PRODUCT_NAME: SaltareKeyboardExtension
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
