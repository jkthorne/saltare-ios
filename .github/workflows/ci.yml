# Runs the Swift package tests, then compiles the app. Until this file existed
# they ran only on whichever Mac someone happened to open Xcode on.
#
# macOS runners are billed at 10x the Linux rate, so this stays deliberately
# small: `swift test` per package (no simulator — every package declares a macOS
# platform), plus one app build.
#
# The app build covers what the packages can't. The four packages are ~40% of
# the Swift here; the rest — the app target, the widget/Live Activity extension
# and the share extension — has no test target and, until that job existed, was
# compiled by nothing. `xcodebuild` on the app also builds the two embedded
# extensions, so one job covers all three. It does not run tests: there are none
# to run yet.
#
# It runs on pull requests only, to keep the push path cheap. NOTE: nothing has
# ever been merged here via a pull request, so as things stand this job will not
# run at all. If the app and extensions should be built on master pushes too,
# drop the `if:` on the job.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  packages:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - SaltareAgent
          - SaltareHUD
          - SaltareKit
          - SaltareWorkspace
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Show toolchain
        run: swift --version

      - name: Test ${{ matrix.package }}
        run: swift test --package-path Packages/${{ matrix.package }}

  app:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # The .xcodeproj is generated, never committed — so CI is also the check
      # that project.yml still describes a project that can be generated.
      - name: Generate the Xcode project
        run: xcodegen generate

      # Unsigned: CI has no signing identity, and nothing here needs one to
      # compile. `generic/platform=iOS Simulator` avoids booting a simulator.
      - name: Build Saltare (app + widget + share extensions)
        run: |
          xcodebuild build \
            -project Saltare.xcodeproj \
            -scheme Saltare \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      # xcodebuild can exit 0 having compiled nothing — an empty scheme does
      # exactly that, and did. A green build step is not evidence of a build, so
      # assert the products exist.
      - name: Verify the products were actually built
        run: |
          products="build/Build/Products/Debug-iphonesimulator"
          app="$products/Saltare.app"
          test -d "$app" || { echo "::error::no Saltare.app — the build compiled nothing"; ls -R "$products" || true; exit 1; }
          echo "built: $app"
          for ext in SaltareWidgets SaltareShare; do
            found=$(find "$products" -name "$ext.appex" -maxdepth 4 -print -quit)
            test -n "$found" || { echo "::error::no $ext.appex — the extension did not build"; exit 1; }
            echo "built: $found"
          done
